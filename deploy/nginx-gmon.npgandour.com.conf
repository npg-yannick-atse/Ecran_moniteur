# Vhost openresty / nginx pour gmon.npgandour.com
# -----------------------------------------------
# Constat à l'origine de ce fichier : l'openresty en frontal sur 10.10.10.200:443
# ne connaît pas le nom `gmon.npgandour.com` et coupe le handshake TLS avec
# l'alerte 112 « unrecognized_name ». Il lui manque simplement ce server block.
#
# Dans cette architecture, c'est NGINX qui termine le TLS ; l'application Node
# reste en HTTP simple sur son port (démarrée avec TLS=off).
#
# Installation :
#   1. copier ce fichier dans conf.d/ (ou sites-available/ + lien symbolique)
#   2. déposer les 3 fichiers du certificat aux chemins indiqués ci-dessous
#   3. nginx -t     (vérifie la syntaxe)
#   4. nginx -s reload

# Le certificat doit être la CHAÎNE COMPLÈTE : certificate.crt suivi de
# ca_bundle.crt dans un seul fichier, sinon Android et les vieux Windows
# afficheront « certificat non fiable ».
#   Windows : type certificate.crt ca_bundle.crt > gmon-fullchain.crt
#   Linux   : cat  certificate.crt ca_bundle.crt > gmon-fullchain.crt

upstream ecran_moniteur {
    # L'app Node écoute en clair. 127.0.0.1 si nginx tourne sur la même
    # machine — à remplacer par l'IP du serveur applicatif sinon.
    server 127.0.0.1:8082;
    keepalive 32;
}

server {
    listen 80;
    server_name gmon.npgandour.com;

    # Les écrans déjà configurés en http:// continuent de fonctionner.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name gmon.npgandour.com;

    ssl_certificate     /etc/nginx/certs/gmon-fullchain.crt;
    ssl_certificate_key /etc/nginx/certs/private.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Le dashboard tient dans une seule réponse ; pas de limite serrée utile.
    client_max_body_size 5m;

    location / {
        proxy_pass http://ecran_moniteur;
        proxy_http_version 1.1;

        # Host d'origine conservé : sans lui, les liens et redirections
        # générés par l'app repartiraient sur l'upstream interne.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Indique à Next qu'on est en HTTPS côté client, même si le lien
        # nginx → app est en clair.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        # Le dashboard interroge l'API toutes les 10 s ; ces délais évitent
        # les coupures si une requête SQL est momentanément lente.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Les assets Next sont immuables (nom hashé) : on laisse le navigateur
    # les garder, ça évite de retélécharger le bundle à chaque refresh écran.
    location /_next/static/ {
        proxy_pass http://ecran_moniteur;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
